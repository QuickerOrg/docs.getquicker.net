# Validate xaction module catalog and pages. Does not checkout Quicker.
name: Xaction docs check

on:
  pull_request:
    paths:
      - 'data/xaction/**'
      - 'data/bridges/**'
      - 'docs/v2/xaction/**'
      - 'docs/v2/features/software-connections/**'
      - 'docs/index.md'
      - 'docs/v2/index.md'
      - 'tools/xaction-docs/**'
      - 'tools/bridge-docs/**'
      - 'package.json'
      - 'src/components/XActionModuleMeta/**'
      - 'src/components/XActionLanding/**'
      - '.github/workflows/xaction-check.yml'
  workflow_dispatch:

concurrency:
  group: xaction-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Check module docs
        run: |
          npm run docs:xaction:check
          npm run docs:xaction:test
          npm run docs:bridges:check
          npm run docs:bridges:test
